name: "MCP — Injections via appels d'outils"
scope:
  active_testing: true
  requests_per_second: 1
variables:
  base_url: "http://localhost:8080"
  mcp_path: "/mcp"
  canary: "{{uuid}}"
defaults:
  read_timeout: 15
  verify: false

tests:
  - id: mcp-path-traversal
    name: "MCP — Path traversal via outil de lecture"
    severity: critical
    request:
      method: POST
      path: "{{mcp_path}}"
      headers:
        Content-Type: "application/json"
        Accept: "application/json, text/event-stream"
      json:
        jsonrpc: "2.0"
        id: 20
        method: "tools/call"
        params:
          name: "read_file"
          arguments:
            path: "../../../../etc/passwd"
    assert:
      - status_not: 500
      # Si le serveur retourne "root:x:0:0", c'est une preuve
      - body_not_contains: "root:x:0:0"
      - body_not_contains: "daemon:x:"

  - id: mcp-command-injection
    name: "MCP — Command injection via outil d'exécution"
    severity: critical
    request:
      method: POST
      path: "{{mcp_path}}"
      headers:
        Content-Type: "application/json"
        Accept: "application/json, text/event-stream"
      json:
        jsonrpc: "2.0"
        id: 21
        method: "tools/call"
        params:
          name: "run_command"
          arguments:
            command: "echo {{canary}}"
    assert:
      - status_not: 500
      # Le canary doit apparaître si l'injection fonctionne
      - body_contains_canary: "{{canary}}"

  - id: mcp-ssrf-metadata
    name: "MCP — SSRF vers metadata cloud (169.254.169.254)"
    severity: critical
    request:
      method: POST
      path: "{{mcp_path}}"
      headers:
        Content-Type: "application/json"
        Accept: "application/json, text/event-stream"
      json:
        jsonrpc: "2.0"
        id: 22
        method: "tools/call"
        params:
          name: "fetch_url"
          arguments:
            url: "http://169.254.169.254/latest/meta-data/"
    assert:
      - status_not: 500
      - body_not_contains: "ami-id"
      - body_not_contains: "instance-id"
      - body_not_regex: "(?i)(accesskeyid|secretaccesskey|token)"

  - id: mcp-resource-ssrf
    name: "MCP — SSRF via resource URI"
    severity: high
    request:
      method: POST
      path: "{{mcp_path}}"
      headers:
        Content-Type: "application/json"
        Accept: "application/json, text/event-stream"
      json:
        jsonrpc: "2.0"
        id: 23
        method: "resources/read"
        params:
          uri: "file:///etc/passwd"
    assert:
      - status_not: 500
      - body_not_contains: "root:x:0:0"