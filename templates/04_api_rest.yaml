name: "API REST (exemple avec authentification)"
description: "Modèle : login → capture du token → appels protégés. Adaptez les chemins."
variables:
  base_url: "http://localhost:3000"
  login_path: "/api/login"
  protected_path: "/api/me"
  username: "demo"
  password: "demo"
defaults:
  timeout: 10
  verify: false
  headers:
    Accept: application/json
    User-Agent: "HTTPDebugger/1.0 (api)"
tests:
  - id: api-001
    name: "Healthcheck JSON"
    severity: high
    request: { method: GET, path: /health }
    assert:
      - status: 200
      - header_matches: { name: Content-Type, regex: "application/json" }
      - time_lt: 1.0

  - id: api-002
    name: "Ressource protégée sans token → 401"
    severity: high
    request: { method: GET, path: "{{protected_path}}" }
    assert:
      - status: [401, 403]

  - id: api-003
    name: "Login → capture du token"
    severity: high
    request:
      method: POST
      path: "{{login_path}}"
      json: { username: "{{username}}", password: "{{password}}" }
    capture:
      token: { json_path: token }
    assert:
      - status: 200
      - json_path: { path: token, exists: true }

  - id: api-004
    name: "Ressource protégée avec token → 200"
    severity: high
    request:
      method: GET
      path: "{{protected_path}}"
      headers: { Authorization: "Bearer {{token}}" }
    assert:
      - status: 200

  - id: api-005
    name: "Token falsifié → 401"
    severity: high
    request:
      method: GET
      path: "{{protected_path}}"
      headers: { Authorization: "Bearer {{token}}x" }
    assert:
      - status: [401, 403]

  - id: api-006
    name: "Erreur 404 au format JSON, sans fuite"
    severity: medium
    request: { method: GET, path: /api/inexistant }
    assert:
      - status: 404
      - body_not_regex: "(Traceback|Stack trace|at .*\\.js:\\d+)"

  - id: api-007
    name: "Limitation de débit annoncée"
    severity: info
    request: { method: GET, path: /health }
    assert:
      - header_matches: { name: "X-RateLimit-Limit", regex: "\\d+" }
