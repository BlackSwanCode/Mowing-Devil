name: "Serveur MCP (Streamable HTTP)"
description: "Conformité JSON-RPC / MCP et contrôle d'Origin (protection DNS-rebinding)"
variables:
  base_url: "http://localhost:3000"
  mcp_path: "/mcp"
  protocol_version: "2025-06-18"
defaults:
  timeout: 15
  verify: false
  headers:
    Content-Type: application/json
    Accept: "application/json, text/event-stream"
    User-Agent: "HTTPDebugger/1.0 (mcp)"
tests:
  - id: mcp-001
    name: "initialize → 200 + protocolVersion"
    severity: high
    request:
      method: POST
      path: "{{mcp_path}}"
      json:
        jsonrpc: "2.0"
        id: 1
        method: initialize
        params:
          protocolVersion: "{{protocol_version}}"
          capabilities: {}
          clientInfo: { name: http-debugger, version: "1.0" }
    capture:
      session_id: { header: Mcp-Session-Id }
    assert:
      - status: 200
      - body_contains: protocolVersion
      - body_contains: serverInfo

  - id: mcp-002
    name: "notifications/initialized → 202"
    severity: medium
    request:
      method: POST
      path: "{{mcp_path}}"
      headers:
        Mcp-Session-Id: "{{session_id}}"
        MCP-Protocol-Version: "{{protocol_version}}"
      json: { jsonrpc: "2.0", method: "notifications/initialized" }
    assert:
      - status: [200, 202]

  - id: mcp-003
    name: "tools/list renvoie une liste d'outils"
    severity: high
    request:
      method: POST
      path: "{{mcp_path}}"
      headers:
        Mcp-Session-Id: "{{session_id}}"
        MCP-Protocol-Version: "{{protocol_version}}"
      json: { jsonrpc: "2.0", id: 2, method: "tools/list" }
    assert:
      - status: 200
      - body_contains: '"tools"'

  - id: mcp-004
    name: "Méthode inconnue → erreur JSON-RPC -32601"
    severity: medium
    request:
      method: POST
      path: "{{mcp_path}}"
      headers:
        Mcp-Session-Id: "{{session_id}}"
        MCP-Protocol-Version: "{{protocol_version}}"
      json: { jsonrpc: "2.0", id: 3, method: "methode/inexistante" }
    assert:
      - body_contains: "-32601"
      - body_not_regex: "(Traceback|Stack trace|at .*\\.js:\\d+)"

  - id: mcp-005
    name: "JSON invalide → -32700 / 400, sans fuite"
    severity: medium
    request:
      method: POST
      path: "{{mcp_path}}"
      body: '{"jsonrpc": "2.0", "id": 4, "method": '
    assert:
      - status: [400, 200]
      - status_not: "5xx"
      - body_not_regex: "(Traceback|Stack trace|at .*\\.js:\\d+|SyntaxError)"

  - id: mcp-006
    name: "Origin hostile refusé (DNS rebinding)"
    severity: high
    request:
      method: POST
      path: "{{mcp_path}}"
      headers: { Origin: "http://evil.example" }
      json:
        jsonrpc: "2.0"
        id: 5
        method: initialize
        params:
          protocolVersion: "{{protocol_version}}"
          capabilities: {}
          clientInfo: { name: http-debugger, version: "1.0" }
    assert:
      - status: [400, 401, 403]

  - id: mcp-007
    name: "Session inconnue → 404 (ou 400)"
    severity: low
    request:
      method: POST
      path: "{{mcp_path}}"
      headers:
        Mcp-Session-Id: "session-inexistante-0000"
        MCP-Protocol-Version: "{{protocol_version}}"
      json: { jsonrpc: "2.0", id: 6, method: "tools/list" }
    assert:
      - status: [400, 404]

  - id: mcp-008
    name: "Sans authentification : accès refusé (si auth activée)"
    severity: info
    request:
      method: POST
      path: "{{mcp_path}}"
      json: { jsonrpc: "2.0", id: 7, method: "tools/list" }
    assert:
      - status: [400, 401, 403]
