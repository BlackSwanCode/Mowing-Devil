name: "Durcissement & en-têtes de sécurité"
description: "Hygiène de sécurité courante d'un serveur web que vous administrez"
variables:
  base_url: "http://localhost:8080"
  evil_origin: "https://evil.example"
defaults:
  timeout: 10
  verify: false
  headers:
    User-Agent: "HTTPDebugger/1.0 (hardening)"
tests:
  - id: sec-001
    name: "X-Content-Type-Options: nosniff"
    severity: medium
    request: { method: GET, path: / }
    assert:
      - header_equals: { name: X-Content-Type-Options, value: nosniff }

  - id: sec-002
    name: "Protection clickjacking (X-Frame-Options)"
    severity: medium
    request: { method: GET, path: / }
    assert:
      - header_matches: { name: X-Frame-Options, regex: "^(DENY|SAMEORIGIN)$" }

  - id: sec-003
    name: "Content-Security-Policy présente"
    severity: medium
    request: { method: GET, path: / }
    assert:
      - header_present: Content-Security-Policy

  - id: sec-004
    name: "Referrer-Policy définie"
    severity: low
    request: { method: GET, path: / }
    assert:
      - header_present: Referrer-Policy

  - id: sec-005
    name: "HSTS (à tester en HTTPS)"
    severity: medium
    request: { method: GET, path: / }
    assert:
      - header_matches: { name: Strict-Transport-Security, regex: "max-age=\\d{6,}" }

  - id: sec-006
    name: "Bannière Server sans numéro de version"
    severity: low
    request: { method: GET, path: / }
    assert:
      - header_not_matches: { name: Server, regex: "\\d+\\.\\d+" }

  - id: sec-007
    name: "X-Powered-By absent"
    severity: low
    request: { method: GET, path: / }
    assert:
      - header_absent: X-Powered-By

  - id: sec-008
    name: "Cookies : Secure / HttpOnly / SameSite"
    severity: medium
    request: { method: GET, path: / }
    assert:
      - cookie_flags: { name: "*", require: [Secure, HttpOnly, SameSite] }

  - id: sec-009
    name: "CORS : l'origine hostile n'est pas reflétée"
    severity: high
    request:
      method: GET
      path: /
      headers: { Origin: "{{evil_origin}}" }
    assert:
      - header_not_matches: { name: Access-Control-Allow-Origin, regex: "evil\\.example|^\\*$" }

  - id: sec-010
    name: "CORS preflight : pas de credentials avec origine hostile"
    severity: high
    request:
      method: OPTIONS
      path: /
      headers:
        Origin: "{{evil_origin}}"
        Access-Control-Request-Method: POST
    assert:
      - header_not_matches: { name: Access-Control-Allow-Credentials, regex: "true" }
      - header_not_matches: { name: Access-Control-Allow-Origin, regex: "evil\\.example" }

  - id: sec-011
    name: "Pas de listing de répertoire"
    severity: medium
    request: { method: GET, path: /static/ }
    assert:
      - body_not_regex: "(Index of /|Directory listing for)"

  - id: sec-012
    name: "Fichiers sensibles inaccessibles : /.git/HEAD"
    severity: high
    request: { method: GET, path: /.git/HEAD }
    assert:
      - status: [401, 403, 404]
      - body_not_regex: "^ref: refs/"

  - id: sec-013
    name: "Fichiers sensibles inaccessibles : /.env"
    severity: critical
    request: { method: GET, path: /.env }
    assert:
      - status: [401, 403, 404]
      - body_not_regex: "(?m)^[A-Z_]{3,}=.+"

  - id: sec-014
    name: "Pages de diagnostic fermées : /phpinfo.php"
    severity: high
    request: { method: GET, path: /phpinfo.php }
    assert:
      - status: [401, 403, 404]
      - body_not_contains: "PHP Version"

  - id: sec-015
    name: "Pages de diagnostic fermées : /server-status"
    severity: medium
    request: { method: GET, path: /server-status }
    assert:
      - status: [401, 403, 404]

  - id: sec-016
    name: "Pas de détection par User-Agent d'outil (réponse identique)"
    severity: info
    request:
      method: GET
      path: /
      headers: { User-Agent: "sqlmap/1.0" }
    assert:
      - status: ["2xx", "3xx"]
