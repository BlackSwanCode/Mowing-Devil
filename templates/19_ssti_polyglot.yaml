name: "Injection de Template Côté Serveur (SSTI) - Polyglotte Démoniaque"
variables:
  base_url: "http://localhost:8080"
  canary: "MOWING_DEVIL_777"
defaults:
  read_timeout: 10
  verify: false
  follow_redirects: true

tests:
  - id: ssti-jinja-polyglot
    name: "SSTI Jinja2/Python - Calcul d'expression réfléchi"
    severity: critical
    request:
      method: GET
      path: "/search"
      params: 
        q: "${{7*7}}"
    assert:
      - status: 200
      - body_contains: "49"

  - id: ssti-blind-oob
    name: "SSTI Aveugle - Déclencheur OOB (Out-of-Band)"
    severity: critical
    mode: attack
    request:
      method: POST
      path: "/api/render"
      json: 
        template: "user_input"
    attack:
      category: ssti_blind
      target: body
      param: template
      success_if:
        - body_contains_canary: "{{canary}}"